<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="leaflet.css"><style>
html,body,#map{height:100%;width:100%;margin:0;background:#181321;font-family:sans-serif} .leaflet-container{background:#1c1329} .leaflet-control-zoom a,.tools button{background:#261b32;color:#f9eaff;border:1px solid #735584;cursor:pointer}.tools{flex-wrap:wrap;right:8px;position:absolute;z-index:1000;top:10px;left:48px;display:flex;gap:5px}.tools button{border-radius:6px;padding:7px;font-size:11px}.pin{width:23px;height:23px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:#7936a2;border:2px solid #fff;box-shadow:0 2px 8px #30203980}.pin span{display:block;transform:rotate(45deg);text-align:center;line-height:23px;color:white;font-size:18px}.selected .pin{background:#c13ce6;box-shadow:0 0 0 6px #b25cd944}.leaflet-tooltip{background:#27182f;color:#fff;border-color:#9671a4}.status{position:absolute;bottom:24px;left:8px;z-index:1000;max-width:85%;background:#281930ed;color:white;border-radius:6px;padding:6px 9px;font-size:11px;pointer-events:none}.leaflet-control-attribution{font-size:9px}.leaflet-tile-pane{filter:grayscale(1) invert(1) sepia(1) saturate(2) hue-rotate(210deg) brightness(.65)}
.compact .tools,.compact .map-tools-toggle,.compact #addresses,.compact #route{display:none!important}
.tools{display:flex;background:#25182feb;padding:10px;border:1px solid #644177;border-radius:12px;right:10px;left:48px;top:10px}.tools input,.tools select{max-width:100%;background:#1c1228;color:#eee4f8;border:1px solid #604274;border-radius:6px;padding:6px}
</style></head><body><div id="map"></div><div class="tools"><select aria-label="选择城市" onchange="const p=this.value.split(',').map(Number);if(p.length===2)updateLocation(p[0],p[1])"><option value="">选择城市</option><option value="22.55,114.02">深圳</option><option value="31.23,121.50">上海</option><option value="39.908,116.397">北京</option><option value="23.129,113.264">广州</option><option value="30.274,120.155">杭州</option></select><input id="address" aria-label="输入城市和地址" placeholder="城市和详细地址" style="width:145px"><button onclick="if(bridge)bridge.geocode(document.getElementById('address').value)">解析地址</button><button onclick="fitStations(false)">当前站点区域</button><button onclick="fitStations(true)">全部站点</button><button onclick="locateMe()">我的位置</button><button onclick="pickLocation()">地图选位置</button><button onclick="if(bridge)bridge.navigateTo(selected)">规划路线</button></div><div id="route" style="display:none;position:absolute;right:8px;bottom:44px;z-index:1000;max-height:38%;overflow:auto;max-width:270px;background:#281930ed;color:white;padding:9px;font-size:12px"></div><div id="addresses" style="position:absolute;top:65px;left:48px;z-index:1001;background:#281930;color:white;max-width:75%"></div><div id="status" class="status">正在加载在线地图…</div><script src="leaflet.js"></script><script src="qrc:///qtwebchannel/qwebchannel.js"></script><script>
'use strict';
const map=window.map=L.map('map',{zoomControl:true,zoomSnap:.5}).setView([22.55,114.02],12);
const status=document.getElementById('status');let loaded=0,failed=0,bridge=null,rows=[],selected='',markers=new Map(),cameraMode='manual',cameraTouched=false;
const tiles=window.tiles=L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>'}).addTo(map);
tiles.on('loading',()=>{loaded=0;failed=0;status.hidden=false;status.textContent='正在加载在线地图…'});
tiles.on('tileload',()=>{loaded++;window.loadedTiles=(window.loadedTiles||0)+1});
tiles.on('tileerror',()=>failed++);
tiles.on('load',()=>{status.hidden=!failed;status.textContent=failed?'部分底图未加载，请检查网络或点击重载地图':''});
setTimeout(()=>{if(!window.loadedTiles){status.hidden=false;status.textContent='在线地图尚未加载，请检查网络或点击重载地图'}},15000);
L.control.scale({imperial:false}).addTo(map);
new QWebChannel(qt.webChannelTransport,c=>{bridge=c.objects.stationBridge});
let locationMarker=null, picking=false;
function updateLocation(lat,lon,notify=true,focus=true){
 if(notify)clearRoute();
 if(locationMarker) locationMarker.remove();
 locationMarker=L.circleMarker([lat,lon],{radius:8,color:'#fff',fillColor:'#3478f6',fillOpacity:1}).addTo(map).bindTooltip('我的位置');
 if(focus){cameraMode='user';cameraTouched=true;map.setView([lat,lon],13)} if(bridge && notify)bridge.locate(lat,lon);
 status.hidden=false;status.textContent='已更新我的位置，可选择站点导航';
}
window.focusLocation=function(onlyIfUntouched=false){if(onlyIfUntouched&&cameraTouched)return;if(locationMarker){cameraMode='user';cameraTouched=true;clearRoute();map.flyTo(locationMarker.getLatLng(),15,{duration:.45})}};
window.locateMe=function(automatic=false){
 if(!navigator.geolocation){pickLocation();return}
 navigator.geolocation.getCurrentPosition(p=>updateLocation(p.coords.latitude,p.coords.longitude,true,!automatic||!cameraTouched),()=>{
 if(automatic&&locationMarker&&!cameraTouched)window.focusLocation();
 status.hidden=false;status.textContent='无法自动定位，请点击“地图选位置”设置出发点';},{enableHighAccuracy:true,timeout:8000});
}
function pickLocation(){picking=true;status.hidden=false;status.textContent='请点击地图设置您的出发位置'}
map.on('click',e=>{if(picking){picking=false;updateLocation(e.latlng.lat,e.latlng.lng)}});
map.on('dragstart',()=>{cameraMode='manual';cameraTouched=true});
function icon(active){return L.divIcon({className:active?'selected':'',html:'<div class="pin"><span>ϟ</span></div>',iconSize:[27,36],iconAnchor:[13,32]})}
window.fitStations=function(all){if(!rows.length)return;const ref=rows.find(r=>r.id===selected)||rows[0];const group=all?rows:rows.filter(r=>map.distance([r.latitude,r.longitude],[ref.latitude,ref.longitude])<30000);map.fitBounds(group.map(r=>[r.latitude,r.longitude]),{padding:[42,55],maxZoom:15,animate:false})};
window.setStations=function(payload){
 const signature=JSON.stringify(payload.rows);
 rows=payload.rows;selected=payload.selected;window.stationSignature=signature;
 markers.forEach(m=>m.remove());markers.clear();
 rows.forEach(r=>{const name=document.createElement('span');name.textContent=r.name||'充电站';const m=L.marker([r.latitude,r.longitude],{icon:icon(r.id===selected),title:r.name||'充电站'}).addTo(map).bindTooltip(name,{direction:'top',offset:[0,-25],permanent:r.id===selected});m.on('click',()=>{if(bridge)bridge.selectStation(r.id)});markers.set(r.id,m)});
};
window.selectStation=function(id,focus){
 if(!markers.has(id))return;
 if(focus)clearRoute();
 selected=id;
 markers.forEach((marker,markerId)=>marker.setIcon(icon(markerId===selected)));
 const marker=markers.get(id);marker.openTooltip();
 if(focus){cameraMode='station';cameraTouched=true;map.flyTo(marker.getLatLng(),15,{duration:.45})}
};
let routeLayer=null;
function clearRoute(){if(routeLayer)routeLayer.remove();routeLayer=null;document.getElementById('route').style.display='none'}
window.mapMessage=function(text){status.hidden=false;status.textContent=text};
window.showAddresses=function(addresses){
 const host=document.getElementById('addresses');host.replaceChildren();
 addresses.forEach(a=>{const b=document.createElement('button');b.textContent=a.address;b.style.cssText='display:block;max-width:100%;white-space:normal;text-align:left;padding:8px';b.onclick=()=>{host.replaceChildren();updateLocation(a.latitude,a.longitude)};host.append(b)});
 mapMessage('请选择匹配地址 · © OpenStreetMap contributors');
};
window.showRoute=function(route){
 clearRoute();routeLayer=L.geoJSON(route.geometry,{style:{color:'#3478f6',weight:6}}).addTo(map);
 cameraMode='route';cameraTouched=true;
 map.fitBounds(routeLayer.getBounds(),{padding:[55,70]});
 const host=document.getElementById('route');host.replaceChildren();host.style.display='block';
 const title=document.createElement('strong');title.textContent=(route.distance_m/1000).toFixed(1)+' km · 约'+Math.ceil(route.duration_s/60)+'分钟';host.append(title);
 const directions={'left':'左转','right':'右转','slight left':'向左前方','slight right':'向右前方','sharp left':'向左后方','sharp right':'向右后方','straight':'直行','uturn':'掉头'};
 route.steps.forEach(s=>{const p=document.createElement('div');p.textContent=(s.maneuver==='arrive'?'到达终点':s.maneuver==='depart'?'出发':s.maneuver==='roundabout'?'进入环岛':directions[s.modifier]||'沿路行驶')+' · '+s.name+' · '+Math.round(s.distance)+'米';host.append(p)});
 const foot=document.createElement('small');foot.textContent=route.attribution;host.append(foot);mapMessage('驾车路线已规划，路线仅供演示参考');
};
new ResizeObserver(()=>map.invalidateSize({pan:false})).observe(document.getElementById('map'));
</script></body></html>
