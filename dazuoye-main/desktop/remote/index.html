<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Electra · Qt 原生界面</title><style>@font-face{font-family:Noto;src:url("./noto-sans-sc.woff2")}*{box-sizing:border-box}body{margin:0;background:#100a1a;color:#eadcf7;font:14px Noto,system-ui,sans-serif}header{height:62px;display:flex;align-items:center;gap:16px;padding:0 22px;background:#23142e;border-bottom:1px solid #51315e}b{font-size:18px;margin-right:auto}a,button{font:inherit;color:inherit;background:#392047;border:1px solid #724989;border-radius:10px;padding:8px 14px;text-decoration:none;cursor:pointer}a.active{background:#7946a0}#status{font-size:12px;color:#c5a3d6}#screen{height:calc(100dvh - 100px);width:100%;display:flex;align-items:center;justify-content:center;overflow:hidden}footer{height:38px;text-align:center;font-size:12px;color:#a28bb4;padding:10px}#retry{display:none}@media(max-width:650px){header{gap:7px;padding:0 10px}b{font-size:13px}a,button{padding:8px;font-size:12px}#status{display:none}footer{font-size:10px}}</style></head><body><header><b>▰ ELECTRA · Qt 原生预览</b><a id="admin" href="?view=admin">管理端</a><a id="user" href="?view=user">用户端</a><span id="status">正在连接…</span><button id="retry" onclick="location.reload()">重新连接</button><button id="locate">使用设备位置</button><button id="full">全屏</button></header><div id="screen"></div><footer>这是运行中的 Qt 桌面程序，可直接点击操作。公开演示使用共享窗口，多人操作会同步显示。</footer><script type="module">import RFB from './core/rfb.js';const role=new URLSearchParams(location.search).get('view')==='user'?'user':'admin';document.getElementById(role).classList.add('active');const protocol=location.protocol==='https:'?'wss:':'ws:';const rfb=new RFB(document.getElementById('screen'),`${protocol}//${location.host}${new URL("./websockify",location.href).pathname}?token=${role}`,{shared:true});rfb.scaleViewport=true;rfb.resizeSession=false;rfb.clipViewport=false;rfb.qualityLevel=8;rfb.compressionLevel=2;rfb.addEventListener('connect',()=>document.getElementById('status').textContent='● Qt 窗口已连接');rfb.addEventListener('disconnect',()=>{document.getElementById('status').textContent='连接已断开';document.getElementById('retry').style.display='inline-block'});document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();document.getElementById('locate').onclick=()=>{
 if(!confirm('将当前设备位置发送到公开演示的共享 Qt 窗口，其他访问者也能看到此位置。是否继续？'))return;
 const status=document.getElementById('status');status.textContent='正在定位…';
 if(!navigator.geolocation){alert('设备不支持自动定位，请在 Qt 地图选择城市或地址');return;}
 navigator.geolocation.getCurrentPosition(async p=>{
  try{const response=await fetch(location.protocol+'//'+location.hostname+':8443/public/map/preview-location',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({latitude:p.coords.latitude,longitude:p.coords.longitude})});if(!response.ok)throw Error();status.textContent='位置已发送，请打开 Qt 地图';}
  catch{status.textContent='发送失败，请在 Qt 地图手动定位';alert(status.textContent);}
 },()=>{status.textContent='定位失败，请在 Qt 地图选择城市或地址';alert(status.textContent);},{enableHighAccuracy:true,timeout:10000});
};window.qtPreview=rfb;</script></body></html>
